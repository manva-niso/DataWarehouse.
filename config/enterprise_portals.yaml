  # ==============================================================================
  # 🏆 Fellowships, Open Source, Research & Hackathons (Premier Entry Gateways)
  # ==============================================================================
  fellowships_and_hackathons:
    - name: GSOC (Google Summer of Code)
      url: https://summerofcode.withgoogle.com/
      type: Global Open Source Fellowship
      stipend: "$1,500 - $3,000"
      description: "Mentored contributions to open source software (Apache, Linux, CNCF, Python, etc.)."
    - name: MLH Fellowship (Major League Hacking)
      url: https://fellowship.mlh.io/
      type: Software Engineering Fellowship
      stipend: "Funded Need-based Educational Grant"
      description: "12-week remote internship alternative collaborating on open-source with industry mentors."
    - name: SIH (Smart India Hackathon)
      url: https://www.sih.gov.in/
      type: National Innovation Hackathon
      stipend: "Rs. 1,00,000 per problem statement + Govt project funding"
      description: "World's biggest open innovation hackathon organized by AICTE and MoE Innovation Cell."
    - name: Microsoft Imagine Cup
      url: https://imaginecup.microsoft.com/
      type: Global Student Tech Competition
      stipend: "$100,000 Global Prize + Mentorship with Microsoft CEO Satya Nadella"
      description: "Build innovative AI and cloud solutions on Microsoft Azure."
    - name: Google Solution Challenge
      url: https://developers.google.com/community/gdsc-solution-challenge
      type: Global Developer Student Challenge
      stipend: "$12,000 prize pool + Google developer mentorship"
      description: "Solve 1 of the 17 UN Sustainable Development Goals using Google Cloud and AI."
    - name: Adobe University Hackathon
      url: https://www.adobe.com/careers/university.html
      type: Student Innovation Hackathon
      stipend: "PPO / FTE Interview Opportunities + Cash Prizes"
      description: "Problem-solving hackathons offering direct interview shortlists at Adobe."
    - name: TCS Research & Innovation
      url: https://www.tcs.com/what-we-do/research
      type: Industrial Research Fellowship
      stipend: "Competitive Fellowship + PhD Sponsorship"
      description: "Deep-tech research across Computing Systems, AI, Cybersecurity, and Physical Sciences."
    - name: DRDO (Defence Research and Development Organisation)
      url: https://www.drdo.gov.in/careers
      type: Government Research & Junior Research Fellow (JRF)
      stipend: "Central Govt JRF Scale (Rs. 37,000/mo + HRA)"
      description: "National defense and aerospace computer science research opportunities."
